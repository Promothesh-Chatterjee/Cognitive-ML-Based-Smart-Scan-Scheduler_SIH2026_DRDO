name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualification:
    name: Full Qualification Suite
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov azure-storage-blob google-cloud-storage

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        if: ${{ env.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: sih2026-ew-demo
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT || 'sih2026-ew-runtime@sih2026-ew-demo.iam.gserviceaccount.com' }}

      - name: Provision baseline checkpoint (fail-closed)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          GCS_TSRD_BUCKET: "sih2026-ew-tsrd"
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "[INFO] Main branch push — strict provisioning (fail-closed)"
            python scripts/provision_baseline.py --strict
          else
            echo "[INFO] Pull request — best-effort provisioning"
            python scripts/provision_baseline.py --best-effort
          fi

      - name: Run test suite with coverage
        env:
          TSRD_ROOT: tests/fixtures/canonical_tsrd
          GCS_TSRD_BUCKET: "sih2026-ew-tsrd"
        run: |
          pytest ew_core/tests/ --cov=ew_core --cov-report=term-missing

      - name: Run full pipeline validation
        run: |
          if [ -f "experiments/checkpoints/production_baseline/checkpoint_gate_25000_frozen.pt" ]; then
            echo "[INFO] Checkpoint present — running full validation (fail-closed)"
            python scripts/validate_pipeline.py
          else
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "::error::QUALIFICATION BLOCKED: Checkpoint not provisioned on main branch."
              exit 1
            else
              echo "::warning::Running structural-only validation (PR without checkpoint)."
              python scripts/validate_pipeline.py --structural-only
            fi
          fi

      - name: Validate CI YAML syntax
        run: |
          python -c "import yaml, sys; [yaml.safe_load(open(f)) for f in __import__('pathlib').Path('.github/workflows').glob('*.yml')]; print('[OK] All workflow YAML valid')" || { echo '[FAIL] YAML validation error'; exit 1; }
