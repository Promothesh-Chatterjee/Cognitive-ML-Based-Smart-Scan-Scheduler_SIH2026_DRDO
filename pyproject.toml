[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ew_core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    "stable-baselines3>=2.3",

    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",

    "pyyaml>=6.0",
    "h5py>=3.10.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",

    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "websocket-client>=1.7.0",
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
    "pyzmq>=26.0.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "azure-monitor-opentelemetry>=1.3",
    "azure-storage-blob>=12.19.0",
    "google-cloud-storage>=2.14.0",
    "slowapi>=0.1.9"
]

[project.optional-dependencies]
render = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ew_core*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = [".", "rf_simulation/scripts"]
testpaths = ["ew_core/tests", "rf_simulation/tests"]
addopts = "-ra -q"
